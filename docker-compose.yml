services:
  db:
    image: postgres:17-alpine
    container_name: move-relay-db
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: move_relay
    ports:
      - "5433:5432"
    volumes:
      - relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d move_relay"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: move-relay-app
    environment:
      DATABASE_URL: postgres://relay:relay@db:5432/move_relay
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

volumes:
  relay_pgdata:
